# Copy to ~/.dbt/profiles.yml and fill in. Never commit real credentials.
northlane:
  target: dev
  outputs:
    dev:
      type: postgres
      host: "{{ env_var('PGHOST', 'localhost') }}"
      port: "{{ env_var('PGPORT', '5432') | int }}"
      user: "{{ env_var('PGUSER', 'analytics') }}"
      password: "{{ env_var('PGPASSWORD') }}"
      dbname: "{{ env_var('PGDATABASE', 'northlane') }}"
      schema: analytics
      threads: 4
      keepalives_idle: 0
